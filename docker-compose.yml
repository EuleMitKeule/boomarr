services:
  boomarr:
    image: ghcr.io/eulemitkeule/boomarr:latest
    container_name: boomarr
    restart: unless-stopped
    environment:
      PUID: 1000
      PGID: 1000
      UMASK: "022"
      TZ: Etc/UTC
      LOG_LEVEL: info
      # Optional: create the web UI admin account from the environment
      # instead of the setup page (e.g. from a Docker secret or .env file).
      # BOOMARR_USERNAME: admin
      # BOOMARR_PASSWORD: change-me
    volumes:
      # Config file (boomarr.yml), probe cache and logs.
      - ./config:/config
      # Source media: READ-ONLY, and mounted at the SAME path as in your
      # Plex/Jellyfin container, otherwise the symlinks will not resolve there.
      - /path/to/media/movies:/media/movies:ro
      - /path/to/media/shows:/media/shows:ro
      # Output: the filtered libraries are created here. Mount it into your
      # media server at the same path as well.
      - /path/to/media/filtered:/media/filtered
    ports:
      - "9797:9797"   # web UI, REST API and Sonarr/Radarr webhooks
    security_opt:
      - no-new-privileges:true
