{{- if .Values.server.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "boomarr.fullname" . }}
  labels:
    {{- include "boomarr.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
  selector:
    {{- include "boomarr.selectorLabels" . | nindent 4 }}
{{- end }}
