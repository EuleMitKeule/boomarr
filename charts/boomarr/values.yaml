# -- Container image
image:
  repository: ghcr.io/eulemitkeule/boomarr
  # -- Defaults to the chart's appVersion
  tag: ""
  pullPolicy: IfNotPresent

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

# -- Who owns /config/boomarr.yml:
#   `ui`        - the web UI edits the file on the config volume; `config` is
#                 only written on the very first start (default)
#   `configMap` - `config`/`existingConfigMap` is mounted read-only (GitOps);
#                 the web UI shows the settings but cannot change them
configMode: ui

# -- Boomarr configuration (initial file in `ui` mode, the whole file in
# `configMap` mode).
# See https://github.com/EuleMitKeule/boomarr/blob/master/docs/configuration.md
config:
  output_path: /media/filtered
  libraries:
    - name: Movies
      input_path: /media/movies
      symlink_libraries:
        - filters:
            - type: audio_language
              languages: [deu]

# -- Use an existing ConfigMap (key `boomarr.yml`) instead of `config`
existingConfigMap: ""

# -- Extra environment variables
env:
  TZ: UTC
  LOG_LEVEL: info

# -- Web UI, REST API, Sonarr/Radarr webhooks and Prometheus /metrics
server:
  enabled: true
  port: 9797
  # -- Require the API key for /metrics as well
  metricsAuth: false
  # -- Fixed API key (stored in a Secret). Leave empty to use the key
  # generated on first start (shown in Settings → Security).
  apiKey: ""
  # -- Existing Secret containing the API key
  existingSecret: ""
  existingSecretKey: api-key

# -- Web UI login. Without credentials, the first visitor creates the admin
# account (a setup token from the log is required from outside the LAN).
auth:
  # -- Admin account from a Secret (BOOMARR_USERNAME / BOOMARR_PASSWORD)
  username: ""
  password: ""
  # -- Existing Secret with the keys below instead of username/password
  existingSecret: ""
  usernameKey: username
  passwordKey: password

# -- Ingress for the web UI
ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: boomarr.example.com
      paths:
        - path: /
          pathType: Prefix
  tls: []
  #  - secretName: boomarr-tls
  #    hosts: [boomarr.example.com]

# -- Prometheus Operator ServiceMonitor (requires server.enabled)
serviceMonitor:
  enabled: false
  interval: 60s
  labels: {}

# -- Apprise notification URLs, stored in a Secret (BOOMARR_NOTIFY_URLS)
notifyUrls: []

service:
  type: ClusterIP
  port: 9797

persistence:
  # -- Stores the probe cache database and log files
  config:
    enabled: true
    existingClaim: ""
    storageClass: ""
    accessMode: ReadWriteOnce
    size: 1Gi

# -- Media volumes. Mount source libraries READ-ONLY and at the same paths
# your media server uses, plus a writable output volume.
volumes: []
#  - name: media
#    nfs:
#      server: nas.local
#      path: /volume1/media
#  - name: filtered
#    persistentVolumeClaim:
#      claimName: media-filtered
volumeMounts: []
#  - name: media
#    mountPath: /media/movies
#    subPath: movies
#    readOnly: true
#  - name: filtered
#    mountPath: /media/filtered

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  fsGroup: 1000
  fsGroupChangePolicy: OnRootMismatch
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: [ALL]

resources: {}
#  requests:
#    cpu: 50m
#    memory: 128Mi
#  limits:
#    memory: 512Mi

livenessProbe:
  exec:
    command: [boomarr, healthcheck]
  initialDelaySeconds: 30
  periodSeconds: 60
  timeoutSeconds: 10
  failureThreshold: 3

podAnnotations: {}
podLabels: {}
nodeSelector: {}
tolerations: []
affinity: {}
