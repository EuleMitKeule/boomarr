site_name: Boomarr
site_description: Symlink-based audio language filter for Plex, Jellyfin & Emby
site_url: https://eulemitkeule.github.io/boomarr/
repo_url: https://github.com/EuleMitKeule/boomarr
repo_name: EuleMitKeule/boomarr
edit_uri: edit/master/docs/

theme:
  name: material
  logo: assets/icon.svg
  favicon: assets/icon.png
  features:
    - navigation.instant
    - navigation.sections
    - navigation.top
    - content.code.copy
    - search.highlight
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: deep orange
      accent: red
      toggle:
        icon: material/weather-night
        name: Dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: deep orange
      accent: red
      toggle:
        icon: material/weather-sunny
        name: Light mode

nav:
  - Home: index.md
  - Installation: installation.md
  - Web UI & security: web-ui.md
  - Configuration: configuration.md
  - Media servers: media-servers.md
  - How it works: how-it-works.md
  - Troubleshooting: troubleshooting.md

markdown_extensions:
  - admonition
  - attr_list
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight
  - pymdownx.superfences
  - pymdownx.details

validation:
  links:
    anchors: warn
