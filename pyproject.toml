[project]
name = "boomarr"
authors = [{ name = "Lennard Beers", email = "l.beers@outlook.de" }]
maintainers = [{ name = "Lennard Beers", email = "l.beers@outlook.de" }]
license = { file = "LICENSE.md" }
description = "🔊 Symlink-based audio language filter for Plex & Jellyfin - automatically mirrors your media library, keeping only files with your desired audio tracks."
readme = "README.md"
requires-python = ">=3.14"
keywords = ["plex", "jellyfin", "emby", "symlink", "audio", "language", "ffprobe", "homelab"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Environment :: Web Environment",
    "Framework :: FastAPI",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
    "Topic :: Multimedia :: Video",
    "Typing :: Typed",
]
version = "0.0.0-dev"
dependencies = [
    "apprise>=1.9",
    "argon2-cffi>=25.1",
    "fastapi>=0.118",
    "httpx>=0.28",
    "itsdangerous>=2.2",
    "joserfc>=1.3",
    "pydantic>=2.12.5",
    "python-dotenv>=1.2.2",
    "pyyaml>=6.0.3",
    "rich>=13",
    "typer>=0.24.1",
    "tzdata>=2025.2",
    "uvicorn>=0.37",
]

[project.urls]
Homepage = "https://github.com/EuleMitKeule/boomarr"
Documentation = "https://github.com/EuleMitKeule/boomarr/tree/master/docs"
Issues = "https://github.com/EuleMitKeule/boomarr/issues"
Changelog = "https://github.com/EuleMitKeule/boomarr/releases"

[project.scripts]
boomarr = "boomarr.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build]
# The web UI is built from frontend/ (npm run build) and git-ignored.
artifacts = ["boomarr/web/dist/**"]

[tool.hatch.build.targets.sdist]
exclude = ["frontend/node_modules", "docs", "charts", "contrib", "tests/fixtures/media"]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "pytest-cov>=7.1.0",
    "respx>=0.22",
    "ruff>=0.15.9",
    "ty>=0.0.84",
    "types-pyyaml>=6.0.12.20250915",
]
docs = [
    "mkdocs>=1.6,<2",
    "mkdocs-material>=9.6",
]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF", "LOG"]
ignore = [
    "E501",   # line length is handled by the formatter
    "RUF001", # unicode in strings/comments (arrows, dashes) is intentional
    "RUF002",
    "RUF003",
    "S603",   # subprocess without shell is exactly what we want (ffprobe)
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S104", "S105", "S106", "S108", "S311"]

[tool.ty.terminal]
error-on-warning = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
filterwarnings = [
    "error::pytest.PytestUnraisableExceptionWarning",
    "error::ResourceWarning",
    # starlette's TestClient suggests the httpx2 fork; httpx works fine
    "ignore:Using `httpx` with `starlette.testclient`",
]

[tool.coverage.run]
source = ["boomarr"]
branch = true

[tool.coverage.report]
fail_under = 100
show_missing = true
skip_covered = true
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "@abc.abstractmethod",
    "if __name__ == .__main__.:",
]
