# Boomarr configuration
# =====================
#
# Full reference: https://github.com/EuleMitKeule/boomarr/blob/master/docs/configuration.md
#
# Boomarr mirrors your media libraries into separate folders that only
# contain (symlinks to) files with the audio languages you want. Point a
# Plex/Jellyfin/Emby library at those folders.
#
# IMPORTANT: symlinks store the path of the original file *as Boomarr sees
# it*. Your media server must see the original media under the very same
# path (e.g. mount /media/movies at /media/movies in both containers), or
# use `relative_symlinks: true` with a shared parent directory.

# Global output directory. Every symlink library gets its own subdirectory.
# Can be overridden per library and per symlink library.
output_path: /media/filtered

# Trigger sources for `boomarr watch`. All triggers feed one debounced queue.
# triggers:
#   - type: schedule
#     interval: 600          # seconds between rescans (default: 600)
#     run_on_start: true     # scan immediately on startup (default: true)

# Web UI, REST API, Sonarr/Radarr webhooks and Prometheus /metrics
# (watch mode). Everything in this file can also be edited in the web UI.
# Webhook URL for Sonarr/Radarr (Settings -> Connect -> Webhook):
# http://boomarr:9797/api/v1/webhook/sonarr (API key: web UI -> Settings -> Security)
# server:
#   enabled: true
#   port: 9797
#   url_base: ""             # e.g. /boomarr behind a reverse proxy
#   trusted_proxies: []      # e.g. [172.16.0.0/12] to trust X-Forwarded-* headers
#   api_key: change-me       # optional fixed key (or BOOMARR_API_KEY); generated otherwise

# Web UI authentication.
# auth:
#   method: forms            # forms (login page) | external (reverse proxy) | none
#   local_bypass: false      # no login from private networks
#   session_days: 30
#   external_header: Remote-User
#   oidc:                    # single sign-on (Authentik, Authelia, Keycloak, ...)
#     enabled: false
#     name: SSO
#     issuer: https://auth.example.com/application/o/boomarr/
#     client_id: boomarr
#     client_secret: change-me
#     allowed_groups: []

# Refuse to remove more than 50 % of an output folder's links at once (when
# more than 20 would go). Run `boomarr scan --force` for intended removals.
# removal_guard:
#   max_percent: 50
#   min_count: 20

# Notifications via Apprise (Telegram, Discord, ntfy, e-mail, ...).
# notifications:
#   urls: ["tgram://bottoken/ChatID"]   # or BOOMARR_NOTIFY_URLS
#   on_errors: true
#   on_blocked: true
#   on_changes: false

# Ask your media server to rescan changed folders right away.
# media_servers:
#   - type: plex
#     url: http://plex:32400
#     token: your-plex-token
#   - type: jellyfin           # or emby
#     url: http://jellyfin:8096
#     api_key: your-api-key

# External subtitles next to a matching media file (e.g. `Movie.de.srt` next
# to `Movie.mkv`) are linked too. Set to [] to disable.
# sidecar_extensions: [.srt, .ass, .ssa, .sub, .idx, .vtt, .sup, .smi]

# File/directory names skipped while scanning (fnmatch patterns).
# ignore_patterns: [".*", "@eaDir", "#recycle", "#snapshot", "$RECYCLE.BIN",
#                   "System Volume Information", "lost+found", "Plex Versions"]

# Create relative instead of absolute symlinks.
# relative_symlinks: false

# Number of files probed in parallel (only matters for new/changed files).
# probe_workers: 4

# Probe cache. SQLite (default) persists results so unchanged files are never
# probed twice; `memory` forgets everything on restart.
# database:
#   type: sqlite

# Uncomment and adapt the libraries below, then restart Boomarr.
# libraries:
#   - name: Movies
#     input_path: /media/movies
#     # output_path: /media/filtered   # optional per-library override
#     symlink_libraries:
#       # Output: /media/filtered/movies-deu
#       - filters:
#           - type: audio_language
#             languages:
#               - deu                 # ISO 639 code; ger / de / de-DE match too
#             # mode: any             # any (default) or all configured languages
#       # More filters: resolution, video_codec, audio_codec, audio_channels;
#       # every filter supports `invert: true`.
#
#   - name: Shows
#     input_path: /media/shows
#     symlink_libraries:
#       # Output: /media/filtered/German Shows
#       - name: German Shows
#         filters:
#           - type: audio_language
#             languages:
#               - code: deu
#                 aliases: [und]      # also accept tracks without a language tag
