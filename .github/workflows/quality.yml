name: Code Quality

on:
  workflow_dispatch:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
  push:
    branches:
      - master
      - develop

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  PYTHON_VERSION: "3.14"
  SONAR_PROJECT_KEY: EuleMitKeule_boomarr
  SONAR_PROJECT_ORGANIZATION: eule

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2

      - name: Install uv
        uses: astral-sh/setup-uv@v8.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
          cache-suffix: uv-${{ runner.os }}-${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: uv sync --all-groups --locked

      - name: Ruff lint
        run: uv run ruff check .

      - name: Ruff format
        run: uv run ruff format --check .

      - name: Mypy
        run: uv run mypy --strict .

  tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2

      - name: Install ffprobe
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg

      - name: Install uv
        uses: astral-sh/setup-uv@v8.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
          cache-suffix: uv-${{ runner.os }}-${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: uv sync --all-groups --locked

      - name: Run tests
        run: uv run pytest --cov=boomarr --cov-report=xml --cov-report=term tests

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.xml

  docker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v7.0.0
        with:
          context: .
          load: true
          tags: boomarr:ci
          build-args: VERSION=0.0.1
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test
        run: |
          set -eux
          docker run --rm boomarr:ci boomarr version | grep 0.0.1
          docker run --rm --entrypoint ffprobe boomarr:ci -version

          work="$(mktemp -d)"
          mkdir -p "$work/config" "$work/filtered"
          cp -r tests/fixtures/media/movies "$work/writable-movies"
          cat > "$work/config/boomarr.yml" <<'EOF'
          output_path: /media/filtered
          libraries:
            - name: Movies
              input_path: /media/movies
              symlink_libraries:
                - filters:
                    - type: audio_language
                      languages: [ger]
          EOF
          chmod 755 "$work"
          sudo chown -R 1000:1000 "$work"

          # Root entrypoint path (PUID/PGID + gosu)
          docker run --rm \
            -v "$work/config:/config" \
            -v "$work/filtered:/media/filtered" \
            -v "$PWD/tests/fixtures/media/movies:/media/movies:ro" \
            boomarr:ci boomarr scan
          test -L "$work/filtered/movies-ger/Sample.Movie.DE.mkv"
          test ! -e "$work/filtered/movies-ger/Sample.Movie.EN.mkv"
          test "$(stat -c %u "$work/filtered/movies-ger")" = "1000"

          # Rootless path (--user), as used on Kubernetes
          docker run --rm --user 1000:1000 \
            -v "$work/config:/config" \
            -v "$work/filtered:/media/filtered" \
            -v "$PWD/tests/fixtures/media/movies:/media/movies:ro" \
            boomarr:ci boomarr status

          # A writable source directory must be refused
          if docker run --rm \
            -v "$work/config:/config" \
            -v "$work/filtered:/media/filtered" \
            -v "$work/writable-movies:/media/movies" \
            boomarr:ci boomarr scan; then
            echo "writable source was not rejected" >&2
            exit 1
          fi

          # Watch mode becomes healthy
          docker run -d --name boomarr-watch \
            -v "$work/config:/config" \
            -v "$work/filtered:/media/filtered" \
            -v "$PWD/tests/fixtures/media/movies:/media/movies:ro" \
            boomarr:ci
          sleep 10
          docker exec boomarr-watch boomarr healthcheck
          docker stop boomarr-watch
          docker logs boomarr-watch
          docker rm boomarr-watch

  helm:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Lint chart
        run: |
          helm lint charts/boomarr
          helm template boomarr charts/boomarr > /dev/null
          helm template boomarr charts/boomarr \
            --set webhook.enabled=true \
            --set persistence.config.existingClaim=cfg > /dev/null

  sonar:
    needs: tests
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2
        with:
          fetch-depth: 0

      - name: Download coverage report
        uses: actions/download-artifact@v4
        with:
          name: coverage

      - name: Fix code coverage paths
        run: |
          sed -i 's|/home/runner/work/boomarr/boomarr|/github/workspace|g' coverage.xml

      - name: Run SonarCloud analysis
        uses: SonarSource/sonarqube-scan-action@v7.1.0
        env:
          GITHUB_TOKEN: ${{ secrets.PAT }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.organization=${{ env.SONAR_PROJECT_ORGANIZATION }}
            -Dsonar.projectKey=${{ env.SONAR_PROJECT_KEY }}
            -Dsonar.python.coverage.reportPaths=coverage.xml
            -Dsonar.sources=boomarr
            -Dsonar.tests=tests
            -Dsonar.python.version=${{ env.PYTHON_VERSION }}
            -Dsonar.text.inclusions=**/*.py
