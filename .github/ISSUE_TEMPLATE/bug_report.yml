name: Bug report
description: Something does not work as expected
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you expect, and what happened instead?
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Boomarr version
      description: Output of `boomarr version`
    validations:
      required: true
  - type: dropdown
    id: install
    attributes:
      label: Installation
      options: [Docker / Compose, Unraid, Helm / Kubernetes, pip / pipx, Other]
    validations:
      required: true
  - type: textarea
    id: config
    attributes:
      label: Configuration
      description: Your `boomarr.yml` (remove API keys) and relevant volume mounts.
      render: yaml
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Run with `LOG_LEVEL=debug` if possible.
      render: text
